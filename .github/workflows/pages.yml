name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - name: Activar as Pages a partir de main/public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"source":{"branch":"main","path":"/public"}}')
          echo "POST /pages -> HTTP $code"
          case "$code" in
            201|200) echo "Pages criado." ;;
            409) echo "Pages já existia." ;;
            *) cat /tmp/resp; exit 1 ;;
          esac
