<link rel="stylesheet" href="styles.css?v=vs56">
<script>
/* As opções de acessibilidade são guardadas só neste dispositivo (localStorage).
   Aplicá-las antes do primeiro paint evita que a página "salte" de tema/contraste. */
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('vs.a11y') || '{}');
    var h = document.documentElement;
    if (p.temaEscuro) h.setAttribute('data-tema-escuro', '');
    if (p.contraste) h.setAttribute('data-contraste-alto', '');
    if (p.movimento) h.setAttribute('data-movimento-reduzido', '');
    if (p.simples) h.setAttribute('data-leitura-simples', '');
    /* --escala no <html> desde o primeiro paint: o botão flutuante e a barra inferior
       precisam dela para não se sobreporem antes de o app.js montar o #app escalado */
    h.style.setProperty('--escala', ([100, 115, 130, 150].indexOf(p.escala) >= 0 ? p.escala : 100) / 100);
  } catch (e) { /* sem localStorage disponível: usar valores padrão */ }
})();
</script>
