<script>
/* Aplicar as opções de acessibilidade antes do primeiro paint. */
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('vs.a11y') || '{}');
    var h = document.documentElement;
    if (p.temaEscuro) h.setAttribute('data-tema-escuro', '');
    if (p.contraste) h.setAttribute('data-contraste-alto', '');
    if (p.movimento) h.setAttribute('data-movimento-reduzido', '');
    h.style.setProperty('--escala', ([100, 115, 130, 150].indexOf(p.escala) >= 0 ? p.escala : 100) / 100);
  } catch (e) { /* sem localStorage: usar valores padrão */ }
})();
</script>
